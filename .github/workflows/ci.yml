# Pipeline de Integração Contínua (CI) - API REST de tarefas (Node.js + Express + PostgreSQL)
#
# Sequência:
#   Pull Request
#     -> [ Análise estática de código | Análise de formatação | Análise estática de segurança ]  (em paralelo)
#     -> Build -> Testes unitários -> Testes de integração -> Criação da imagem Docker
name: CI - API de Tarefas

# GATILHO: todo Pull Request aberto/atualizado para a main
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancela a execução anterior do mesmo PR quando chega um commit novo
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # 1) ANÁLISE ESTÁTICA DE CÓDIGO
  lint:
    name: 1. Analise estatica de codigo (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: ESLint
        run: npm run lint

  # 2) ANÁLISE DE FORMATAÇÃO
  formatacao:
    name: 2. Analise de formatacao (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Prettier (somente verificacao)
        run: npm run format:check

  # 3) ANÁLISE ESTÁTICA DE SEGURANÇA (SAST + dependências)
  seguranca:
    name: 3. Analise estatica de seguranca (Semgrep + npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publicar o resultado na aba Security do GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar Semgrep
        run: pipx install semgrep
      - name: SAST com Semgrep (falha em vulnerabilidades de severidade alta)
        run: >
          semgrep scan
          --config p/javascript --config p/nodejs --config p/expressjs --config p/secrets
          --severity ERROR --error --metrics off
          --sarif-output semgrep.sarif
      - name: Publicar resultado na aba Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Auditoria de dependencias vulneraveis (npm audit)
        run: npm audit --audit-level=high

  # 4) BUILD (só roda se as três análises passarem)
  build:
    name: 4. Build
    needs: [lint, formatacao, seguranca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar build (dist/)
        run: npm run build
      - name: Publicar artefato do build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 5) TESTES UNITÁRIOS
  testes-unitarios:
    name: 5. Testes unitarios
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Jest (com cobertura)
        run: npm run test:unit
      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: coverage/

  # 6) TESTES DE INTEGRAÇÃO (API REST + banco PostgreSQL real)
  testes-integracao:
    name: 6. Testes de integracao (API + PostgreSQL)
    needs: testes-unitarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Baixar artefato do build
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Jest + Supertest contra o PostgreSQL
        run: npm run test:integration
      - name: Smoke test do build (sobe dist/server.js e chama /health)
        run: |
          PORT=3000 node dist/server.js &
          sleep 3
          curl --fail --silent http://localhost:3000/health

  # 7) CRIAÇÃO DA IMAGEM DOCKER (só roda se todos os testes passarem)
  imagem:
    name: 7. Criacao da imagem Docker
    needs: testes-integracao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar no GitHub Container Registry
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
